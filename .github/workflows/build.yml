name: Compilar El Echo

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Compilar mod y shaderpack
        run: gradle build zipShaderpack --no-daemon

      - name: Subir el mod (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: el-echo-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Subir el shaderpack (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: el-echo-shaders
          path: build/distributions/ElEcho-Shaders.zip
